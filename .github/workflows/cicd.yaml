name: cicd

on:
  push:
    paths-ignore:
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
    defaults:
      run:
        working-directory: src
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - uses: olegtarasov/get-tag@9a8716825750e73195b02db42777b92ffe960605 # v2.1.4
      id: tag
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: 10.0.x
    - run: echo "::remove-matcher owner=csc::"
    - uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
    - run: dotnet --info
    - run: dotnet restore
    - run: dotnet build -c Release --no-restore | tee dotnet.buildlog
    - uses: SamhammerAG/dotnet-reviewdog-action@32e1eb9b1ab45e1a433424a0bc3acd30261b25a3 # v2
      with:
        workdir: src
        reporter: github-check
        line_exclude_regex: ".*(warning|error) CS0618:.*"
    - run: dotnet test -c Release --no-build --report-github
    - run: dotnet pack -c Release -p:Version=${{ steps.tag.outputs.tag || '1.0' }} --output nuget-packages
    - if: startsWith(github.ref, 'refs/tags/') 
      run: cd nuget-packages; dotnet nuget push "**/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate --source https://api.nuget.org/v3/index.json
